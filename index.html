<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAPHISM — Generative Grid Studio</title>
<style>
  :root {
    --bg: #111214;
    --panel: #1a1c1f;
    --panel-2: #202327;
    --border: #2c3036;
    --text: #e8eaed;
    --text-dim: #8b919a;
    --accent: #ffd21f;
    --accent-2: #7c5cff;
    --danger: #ff5c5c;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 13px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ─────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
    z-index: 10;
  }
  header h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-right: 8px;
  }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
    user-select: none;
  }
  button:hover { background: #2a2e33; border-color: #3a4048; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  button.primary:hover { background: #ffdd55; }
  button.small { padding: 4px 10px; font-size: 11px; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* ── Layout ──────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }

  /* ── Sidebar ─────────────────────────────── */
  aside {
    width: 300px;
    flex: 0 0 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 40px;
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-thumb { background: #33383f; border-radius: 4px; }
  aside::-webkit-scrollbar-track { background: transparent; }

  details.section {
    border-bottom: 1px solid var(--border);
  }
  details.section > summary {
    list-style: none;
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    user-select: none;
  }
  details.section > summary::before {
    content: "▸";
    margin-right: 8px;
    font-size: 10px;
    transition: transform .15s;
    display: inline-block;
  }
  details.section[open] > summary::before { transform: rotate(90deg); }
  details.section > summary:hover { color: var(--text); }
  .section-body { padding: 4px 16px 16px; }

  /* ── Controls ────────────────────────────── */
  .ctl { margin-bottom: 12px; }
  .ctl label {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 5px;
  }
  .ctl label .val { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: #34383f;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #111;
    cursor: grab;
  }
  input[type=range]:active::-webkit-slider-thumb { cursor: grabbing; }
  select {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  input[type=color] {
    width: 100%;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    cursor: pointer;
    padding: 2px;
  }
  .row { display: flex; gap: 10px; }
  .row > .ctl { flex: 1; }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 10px;
    user-select: none;
  }
  .check input { accent-color: var(--accent); cursor: pointer; }
  .check:hover { color: var(--text); }

  /* segmented shape picker */
  .seg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .seg button {
    padding: 6px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .seg button.active { border-color: var(--accent); background: #2e2a15; }
  .seg svg { display: block; }
  .seg img {
    display: block;
    width: 18px; height: 18px;
    object-fit: contain;
    background: #e8eaed;
    border-radius: 3px;
    padding: 1px;
  }
  #uploadSvg:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Effector cards ──────────────────────── */
  .fx-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
  }
  .fx-card .fx-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .fx-card .fx-head b { font-size: 12px; }
  .fx-card .fx-head .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .fx-actions { display: flex; gap: 6px; }
  #addEffector { width: 100%; border-style: dashed; color: var(--text-dim); }
  #addEffector:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Stage ───────────────────────────────── */
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 28px;
    background:
      radial-gradient(ellipse at 50% 40%, #17181b 0%, #0d0e10 100%);
  }
  #canvasWrap {
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px #2a2d33;
    border-radius: 4px;
    overflow: hidden;
  }
  canvas { display: block; }

  footer {
    flex: 0 0 auto;
    padding: 6px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
    display: flex;
    gap: 16px;
  }
  footer .spacer { flex: 1; }
  kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 5px;
    font-size: 10px;
    font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <h1>GRAPH<span>ISM</span></h1>
  <button id="btnPlay" class="primary">⏸ Pause</button>
  <button id="btnRandom">🎲 Randomize</button>
  <div class="spacer"></div>
  <button id="btnExport">⬇ Export PNG</button>
</header>

<main>
  <aside id="sidebar">

    <details class="section" open>
      <summary>Canvas</summary>
      <div class="section-body">
        <div class="ctl">
          <label>Aspect ratio</label>
          <select id="aspect">
            <option value="1">1 : 1</option>
            <option value="0.8">4 : 5</option>
            <option value="0.75">3 : 4</option>
            <option value="1.7778">16 : 9</option>
            <option value="0.5625">9 : 16</option>
            <option value="1.5">3 : 2</option>
          </select>
        </div>
        <div class="row">
          <div class="ctl">
            <label>Background</label>
            <input type="color" id="bgColor" value="#ffffff">
          </div>
          <div class="ctl">
            <label>Shape</label>
            <input type="color" id="fgColor" value="#000000">
          </div>
        </div>
        <label class="check"><input type="checkbox" id="swapColors"> Swap colors</label>
      </div>
    </details>

    <details class="section" open>
      <summary>Grid</summary>
      <div class="section-body">
        <div class="ctl">
          <label>Columns <span class="val" id="v-cols">18</span></label>
          <input type="range" id="cols" min="2" max="60" step="1" value="18">
        </div>
        <div class="ctl">
          <label>Cell padding <span class="val" id="v-pad">0%</span></label>
          <input type="range" id="pad" min="0" max="40" step="1" value="0">
        </div>
        <label class="check"><input type="checkbox" id="checker"> Checkerboard flip</label>
      </div>
    </details>

    <details class="section" open>
      <summary>Shape</summary>
      <div class="section-body">
        <div class="seg" id="shapePicker"></div>
        <button id="uploadSvg" style="width:100%; margin-bottom:10px; border-style:dashed; color:var(--text-dim)">⬆ Upload custom SVG</button>
        <input type="file" id="svgFile" accept=".svg,image/svg+xml" multiple hidden>
        <label class="check"><input type="checkbox" id="tintSvg" checked> Recolor SVG with shape color</label>
        <div class="ctl">
          <label>Shape scale <span class="val" id="v-shapeScale">100%</span></label>
          <input type="range" id="shapeScale" min="20" max="150" step="1" value="100">
        </div>
      </div>
    </details>

    <details class="section" open>
      <summary>Motion</summary>
      <div class="section-body">
        <div class="ctl">
          <label>Speed <span class="val" id="v-speed">0.25</span></label>
          <input type="range" id="speed" min="0" max="2" step="0.01" value="0.25">
        </div>
        <div class="ctl">
          <label>Movement pattern</label>
          <select id="wave">
            <option value="spin">Spin (continuous)</option>
            <option value="sine" selected>Sine (back & forth)</option>
            <option value="pingpong">Ping-pong (linear)</option>
            <option value="step">Step (snap)</option>
            <option value="pulse">Pulse (heartbeat)</option>
          </select>
        </div>
        <div class="ctl">
          <label>Rotation amount <span class="val" id="v-rot">0.50 turn</span></label>
          <input type="range" id="rot" min="0" max="2" step="0.01" value="0.5">
        </div>
        <div class="ctl">
          <label>Scale pulse <span class="val" id="v-scaleAmt">0%</span></label>
          <input type="range" id="scaleAmt" min="0" max="100" step="1" value="0">
        </div>
        <div class="ctl">
          <label>Quantize rotation</label>
          <select id="quant">
            <option value="0" selected>Off (smooth)</option>
            <option value="4">90° steps</option>
            <option value="2">180° steps</option>
            <option value="8">45° steps</option>
          </select>
        </div>
      </div>
    </details>

    <details class="section" open>
      <summary>Delay / Wave</summary>
      <div class="section-body">
        <div class="ctl">
          <label>Delay pattern</label>
          <select id="delayPattern">
            <option value="linearX">Linear → X</option>
            <option value="linearY">Linear ↓ Y</option>
            <option value="diagonal" selected>Diagonal</option>
            <option value="radial">Radial (center)</option>
            <option value="spiral">Spiral</option>
            <option value="checker">Checker</option>
            <option value="random">Random</option>
          </select>
        </div>
        <div class="ctl">
          <label>Delay amount <span class="val" id="v-delayAmt">1.00 cycle</span></label>
          <input type="range" id="delayAmt" min="0" max="4" step="0.05" value="1">
        </div>
        <label class="check"><input type="checkbox" id="mirrorDelay"> Mirror pattern</label>
      </div>
    </details>

    <details class="section" open>
      <summary>Effectors</summary>
      <div class="section-body">
        <label class="check"><input type="checkbox" id="showFx" checked> Show effector outlines</label>
        <div id="fxList"></div>
        <button id="addEffector">＋ Add effector</button>
      </div>
    </details>

  </aside>

  <div id="stage">
    <div id="canvasWrap"><canvas id="cv"></canvas></div>
  </div>
</main>

<footer>
  <span><kbd>Space</kbd> play / pause</span>
  <span><kbd>R</kbd> randomize</span>
  <span><kbd>E</kbd> export</span>
  <div class="spacer"></div>
  <span id="fps"></span>
</footer>

<script>
"use strict";

/* ═══════════════════════ State ═══════════════════════ */

const P = {
  aspect: 1,
  bg: "#ffffff",
  fg: "#000000",
  swap: false,
  cols: 18,
  pad: 0,
  checker: false,
  shape: "triangle",
  shapeScale: 1,
  speed: 0.25,
  wave: "sine",
  rot: 0.5,          // turns
  scaleAmt: 0,       // 0..1
  quant: 0,          // rotation steps (0 = off)
  delayPattern: "diagonal",
  delayAmt: 1,       // cycles
  mirrorDelay: false,
  showFx: true,
  tintSvg: true,
};

let currentFg = "#000000"; // resolved shape color, used to tint custom SVGs

let effectors = [];
let fxCounter = 0;
let playing = true;
let time = 0;
let lastT = performance.now();

const FX_COLORS = ["#ffd21f", "#7c5cff", "#ff5c8a", "#3ddc97", "#41a9ff", "#ff8c42"];

/* ═══════════════════════ Canvas setup ═══════════════════════ */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const stage = document.getElementById("stage");

function fitCanvas() {
  const availW = stage.clientWidth - 56;
  const availH = stage.clientHeight - 56;
  let w = availW, h = w / P.aspect;
  if (h > availH) { h = availH; w = h * P.aspect; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = Math.round(w) + "px";
  cv.style.height = Math.round(h) + "px";
}
window.addEventListener("resize", fitCanvas);

/* ═══════════════════════ Shapes ═══════════════════════ */
/* Each shape is drawn centered at (0,0) inside a box of size s */

const SHAPES = {
  triangle: (c, s) => {
    c.beginPath();
    c.moveTo(-s/2, -s/2); c.lineTo(s/2, s/2); c.lineTo(-s/2, s/2);
    c.closePath(); c.fill();
  },
  quarter: (c, s) => {
    c.beginPath();
    c.moveTo(-s/2, s/2);
    c.arc(-s/2, s/2, s, -Math.PI/2, 0);
    c.closePath(); c.fill();
  },
  half: (c, s) => {
    c.beginPath();
    c.arc(0, 0, s/2, Math.PI/2, -Math.PI/2);
    c.closePath(); c.fill();
  },
  bar: (c, s) => {
    c.fillRect(-s/2, -s/6, s, s/3);
  },
  halfSquare: (c, s) => {
    c.fillRect(-s/2, 0, s, s/2);
  },
  circle: (c, s) => {
    c.beginPath();
    c.arc(0, 0, s/2, 0, Math.PI*2);
    c.fill();
  },
  bowtie: (c, s) => {
    c.beginPath();
    c.moveTo(-s/2, -s/2); c.lineTo(0, 0); c.lineTo(-s/2, s/2); c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(s/2, -s/2); c.lineTo(0, 0); c.lineTo(s/2, s/2); c.closePath(); c.fill();
  },
  hook: (c, s) => {
    c.beginPath();
    c.moveTo(-s/2, -s/2);
    c.lineTo(s/2, -s/2);
    c.lineTo(s/2, s/2);
    c.quadraticCurveTo(-s/2, s/2, -s/2, -s/2);
    c.closePath(); c.fill();
  },
};

/* Mini icons for the shape picker */
const SHAPE_ICONS = {
  triangle:   '<polygon points="2,16 16,16 2,2"/>',
  quarter:    '<path d="M2 16 L2 2 A14 14 0 0 1 16 16 Z"/>',
  half:       '<path d="M9 2 A7 7 0 0 1 9 16 Z"/>',
  bar:        '<rect x="2" y="6.5" width="14" height="5"/>',
  halfSquare: '<rect x="2" y="9" width="14" height="7"/>',
  circle:     '<circle cx="9" cy="9" r="7"/>',
  bowtie:     '<path d="M2 2 L9 9 L2 16 Z M16 2 L9 9 L16 16 Z"/>',
  hook:       '<path d="M2 2 L16 2 L16 16 Q2 16 2 2 Z"/>',
};

/* ═══════════════════════ Delay patterns ═══════════════════════ */

function hash2(i, j) {
  let h = (i * 374761393 + j * 668265263) ^ 0x5bf03635;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

function cellDelay(i, j, cols, rows) {
  const u = cols > 1 ? i / (cols - 1) : 0.5;
  const v = rows > 1 ? j / (rows - 1) : 0.5;
  let d;
  switch (P.delayPattern) {
    case "linearX":  d = u; break;
    case "linearY":  d = v; break;
    case "diagonal": d = (u + v) / 2; break;
    case "radial": {
      const dx = u - 0.5, dy = v - 0.5;
      d = Math.hypot(dx, dy) / 0.7071;
      break;
    }
    case "spiral": {
      const dx = u - 0.5, dy = v - 0.5;
      const r = Math.hypot(dx, dy) / 0.7071;
      const a = (Math.atan2(dy, dx) / (Math.PI * 2)) + 0.5;
      d = (r + a) % 1;
      break;
    }
    case "checker": d = ((i + j) % 2) * 0.5; break;
    case "random":  d = hash2(i, j); break;
    default: d = 0;
  }
  if (P.mirrorDelay) d = Math.abs(d - 0.5) * 2;
  return d;
}

/* ═══════════════════════ Wave functions ═══════════════════════ */
/* Map a phase (in cycles) to an oscillation value */

function waveValue(phase) {
  const p = phase - Math.floor(phase); // fractional cycle 0..1
  switch (P.wave) {
    case "spin":     return phase;                              // continuous rotation
    case "sine":     return Math.sin(phase * Math.PI * 2) * 0.5;
    case "pingpong": return (p < 0.5 ? p * 2 : 2 - p * 2) - 0.5;
    case "step":     return Math.floor(phase * 4) / 4;
    case "pulse": {
      const e = Math.exp(-p * 5); // sharp attack, slow decay
      return Math.sin(p * Math.PI * 2) * e;
    }
    default: return 0;
  }
}

/* ═══════════════════════ Effectors ═══════════════════════ */

function makeEffector() {
  const fx = {
    id: ++fxCounter,
    color: FX_COLORS[(fxCounter - 1) % FX_COLORS.length],
    enabled: true,
    path: ["orbit", "lissajous", "sweepX", "sweepY", "figure8"][(fxCounter - 1) % 5],
    pathSize: 0.35,   // travel size, fraction of canvas
    speed: 0.3,
    radius: 0.25,     // influence radius, fraction of min dimension
    strength: 1,
    pulse: 0.5,       // radius pulsation amount 0..1
    pulseSpeed: 1,
    target: "rotation",  // rotation | scale | phase
  };
  effectors.push(fx);
  buildFxUI();
  return fx;
}

function effectorPos(fx, t, w, h) {
  const cx = w / 2, cy = h / 2;
  const R = fx.pathSize * Math.min(w, h);
  const a = t * fx.speed * Math.PI * 2;
  switch (fx.path) {
    case "orbit":     return [cx + Math.cos(a) * R, cy + Math.sin(a) * R];
    case "lissajous": return [cx + Math.sin(a * 3) * R, cy + Math.sin(a * 2) * R];
    case "figure8":   return [cx + Math.sin(a) * R, cy + Math.sin(a * 2) * R * 0.6];
    case "sweepX": {
      const p = (t * fx.speed) % 2;
      const x = (p < 1 ? p : 2 - p) * w;
      return [x, cy];
    }
    case "sweepY": {
      const p = (t * fx.speed) % 2;
      const y = (p < 1 ? p : 2 - p) * h;
      return [cx, y];
    }
    default: return [cx, cy];
  }
}

function effectorRadius(fx, t, w, h) {
  const base = fx.radius * Math.min(w, h);
  const pulse = 1 + Math.sin(t * fx.pulseSpeed * Math.PI * 2) * fx.pulse * 0.5;
  return Math.max(base * pulse, 1);
}

/* ═══════════════════════ Render ═══════════════════════ */

function render() {
  const w = cv.width, h = cv.height;
  if (w === 0 || h === 0) return;

  const bg = P.swap ? P.fg : P.bg;
  const fg = P.swap ? P.bg : P.fg;
  currentFg = fg;

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  const cols = P.cols;
  const cell = w / cols;
  const rows = Math.max(1, Math.round(h / cell));
  const cellH = h / rows;

  const fxState = effectors
    .filter(fx => fx.enabled)
    .map(fx => {
      const [x, y] = effectorPos(fx, time, w, h);
      return { fx, x, y, r: effectorRadius(fx, time, w, h) };
    });

  ctx.fillStyle = fg;
  const size = Math.min(cell, cellH);

  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const cx = (i + 0.5) * cell;
      const cy = (j + 0.5) * cellH;

      let phase = time * P.speed - cellDelay(i, j, cols, rows) * P.delayAmt;
      let extraRot = 0;
      let extraScale = 0;

      for (const s of fxState) {
        const d = Math.hypot(cx - s.x, cy - s.y);
        if (d < s.r) {
          const f = 1 - d / s.r;
          const inf = f * f * s.fx.strength; // squared falloff = soft edge
          switch (s.fx.target) {
            case "rotation": extraRot += inf * Math.PI; break;
            case "scale":    extraScale += inf; break;
            case "phase":    phase += inf; break;
          }
        }
      }

      let rot = waveValue(phase) * Math.PI * 2 * P.rot + extraRot;

      if (P.quant > 0) {
        const step = (Math.PI * 2) / P.quant;
        rot = Math.round(rot / step) * step;
      }

      let scl = P.shapeScale * (1 - P.pad / 100);
      if (P.scaleAmt > 0) {
        scl *= 1 + Math.sin(phase * Math.PI * 2) * P.scaleAmt * 0.5;
      }
      scl *= 1 + extraScale * 0.8;
      if (scl <= 0.01) continue;

      const flip = P.checker && ((i + j) % 2 === 1);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      if (flip) ctx.scale(-1, 1);
      SHAPES[P.shape](ctx, size * scl);
      ctx.restore();
    }
  }

  // Effector outlines
  if (P.showFx) {
    for (const s of fxState) {
      ctx.save();
      ctx.strokeStyle = s.fx.color;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 2 * (window.devicePixelRatio || 1);
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = s.fx.color;
      ctx.fill();
      ctx.restore();
    }
  }
}

/* ═══════════════════════ Main loop ═══════════════════════ */

let frames = 0, fpsTime = 0;
const fpsEl = document.getElementById("fps");

function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  if (playing) time += dt;

  render();

  frames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) {
    fpsEl.textContent = Math.round(frames / fpsTime) + " fps";
    frames = 0; fpsTime = 0;
  }
  requestAnimationFrame(loop);
}

/* ═══════════════════════ UI wiring ═══════════════════════ */

const $ = id => document.getElementById(id);

function bindRange(id, key, fmt, transform) {
  const el = $(id), lbl = $("v-" + id);
  el.addEventListener("input", () => {
    const raw = parseFloat(el.value);
    P[key] = transform ? transform(raw) : raw;
    if (lbl) lbl.textContent = fmt(raw);
  });
}

bindRange("cols", "cols", v => v);
bindRange("pad", "pad", v => v + "%");
bindRange("shapeScale", "shapeScale", v => v + "%", v => v / 100);
bindRange("speed", "speed", v => v.toFixed(2));
bindRange("rot", "rot", v => v.toFixed(2) + " turn");
bindRange("scaleAmt", "scaleAmt", v => v + "%", v => v / 100);
bindRange("delayAmt", "delayAmt", v => v.toFixed(2) + " cycle");

$("aspect").addEventListener("change", e => { P.aspect = parseFloat(e.target.value); fitCanvas(); });
$("wave").addEventListener("change", e => P.wave = e.target.value);
$("quant").addEventListener("change", e => P.quant = parseInt(e.target.value));
$("delayPattern").addEventListener("change", e => P.delayPattern = e.target.value);
$("bgColor").addEventListener("input", e => P.bg = e.target.value);
$("fgColor").addEventListener("input", e => P.fg = e.target.value);
$("swapColors").addEventListener("change", e => P.swap = e.target.checked);
$("checker").addEventListener("change", e => P.checker = e.target.checked);
$("mirrorDelay").addEventListener("change", e => P.mirrorDelay = e.target.checked);
$("showFx").addEventListener("change", e => P.showFx = e.target.checked);

/* Shape picker */
const shapePicker = $("shapePicker");

function selectShape(name) {
  P.shape = name;
  shapePicker.querySelectorAll("button").forEach(x =>
    x.classList.toggle("active", x.dataset.shape === name));
}

function addShapeButton(name, iconHTML, title) {
  const b = document.createElement("button");
  b.innerHTML = iconHTML;
  b.title = title || name;
  b.dataset.shape = name;
  if (name === P.shape) b.classList.add("active");
  b.addEventListener("click", () => selectShape(name));
  shapePicker.appendChild(b);
  return b;
}

for (const name of Object.keys(SHAPES)) {
  addShapeButton(name,
    `<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">${SHAPE_ICONS[name]}</svg>`);
}

/* ── Custom SVG shapes ── */

let customCounter = 0;

function prepareSvg(text) {
  // Parse and make sure the SVG has explicit pixel dimensions,
  // otherwise drawImage renders it at 0×0 in some browsers.
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const svg = doc.documentElement;
  if (svg.nodeName.toLowerCase() !== "svg") return null;
  if (!svg.getAttribute("width") || !svg.getAttribute("height")) {
    const vb = (svg.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
    const w = vb[2] > 0 ? vb[2] : 100;
    const h = vb[3] > 0 ? vb[3] : 100;
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
  }
  return new XMLSerializer().serializeToString(svg);
}

function tintedCanvas(entry, color) {
  // Cache a recolored copy of the SVG (silhouette in the given color)
  if (entry.tinted && entry.tintColor === color) return entry.tinted;
  const iw = entry.img.naturalWidth || 1, ih = entry.img.naturalHeight || 1;
  const scale = 512 / Math.max(iw, ih);
  const oc = document.createElement("canvas");
  oc.width = Math.max(1, Math.round(iw * scale));
  oc.height = Math.max(1, Math.round(ih * scale));
  const octx = oc.getContext("2d");
  octx.drawImage(entry.img, 0, 0, oc.width, oc.height);
  octx.globalCompositeOperation = "source-in";
  octx.fillStyle = color;
  octx.fillRect(0, 0, oc.width, oc.height);
  entry.tinted = oc;
  entry.tintColor = color;
  return oc;
}

function addCustomShape(fileName, svgText) {
  const cleaned = prepareSvg(svgText);
  if (!cleaned) { alert(`"${fileName}" is not a valid SVG file.`); return; }

  const url = URL.createObjectURL(new Blob([cleaned], { type: "image/svg+xml" }));
  const img = new Image();
  img.onload = () => {
    const name = "custom" + (++customCounter);
    const entry = { img, tinted: null, tintColor: null };

    SHAPES[name] = (c, s) => {
      const iw = img.naturalWidth || 1, ih = img.naturalHeight || 1;
      const ar = iw / ih;
      let dw = s, dh = s;
      if (ar > 1) dh = s / ar; else dw = s * ar;
      const src = P.tintSvg ? tintedCanvas(entry, currentFg) : img;
      c.drawImage(src, -dw / 2, -dh / 2, dw, dh);
    };

    const b = addShapeButton(name, `<img src="${url}" alt="">`,
      fileName + " — right-click to remove");
    b.addEventListener("contextmenu", e => {
      e.preventDefault();
      delete SHAPES[name];
      b.remove();
      URL.revokeObjectURL(url);
      if (P.shape === name) selectShape("triangle");
    });
    selectShape(name);
  };
  img.onerror = () => alert(`Could not load "${fileName}".`);
  img.src = url;
}

$("uploadSvg").addEventListener("click", () => $("svgFile").click());
$("svgFile").addEventListener("change", e => {
  for (const file of e.target.files) {
    const reader = new FileReader();
    reader.onload = () => addCustomShape(file.name, reader.result);
    reader.readAsText(file);
  }
  e.target.value = "";
});
$("tintSvg").addEventListener("change", e => P.tintSvg = e.target.checked);

/* Play / pause */
const btnPlay = $("btnPlay");
function togglePlay() {
  playing = !playing;
  btnPlay.textContent = playing ? "⏸ Pause" : "▶ Play";
  btnPlay.classList.toggle("primary", playing);
}
btnPlay.addEventListener("click", togglePlay);

/* Randomize */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rnd(min, max) { return min + Math.random() * (max - min); }

function randomize() {
  P.shape = pick(Object.keys(SHAPES));
  P.cols = Math.round(rnd(8, 36));
  P.speed = rnd(0.1, 0.6);
  P.wave = pick(["spin", "sine", "pingpong", "step", "pulse"]);
  P.rot = rnd(0.25, 1.5);
  P.delayPattern = pick(["linearX", "linearY", "diagonal", "radial", "spiral", "checker", "random"]);
  P.delayAmt = rnd(0.5, 2.5);
  P.quant = pick([0, 0, 0, 4, 2]);
  P.checker = Math.random() < 0.35;
  P.mirrorDelay = Math.random() < 0.3;
  P.scaleAmt = Math.random() < 0.3 ? rnd(0.1, 0.5) : 0;
  syncUI();
}

function syncUI() {
  $("cols").value = P.cols; $("v-cols").textContent = P.cols;
  $("speed").value = P.speed; $("v-speed").textContent = P.speed.toFixed(2);
  $("rot").value = P.rot; $("v-rot").textContent = P.rot.toFixed(2) + " turn";
  $("scaleAmt").value = P.scaleAmt * 100; $("v-scaleAmt").textContent = Math.round(P.scaleAmt * 100) + "%";
  $("delayAmt").value = P.delayAmt; $("v-delayAmt").textContent = P.delayAmt.toFixed(2) + " cycle";
  $("wave").value = P.wave;
  $("quant").value = P.quant;
  $("delayPattern").value = P.delayPattern;
  $("checker").checked = P.checker;
  $("mirrorDelay").checked = P.mirrorDelay;
  shapePicker.querySelectorAll("button").forEach(x =>
    x.classList.toggle("active", x.dataset.shape === P.shape));
}
$("btnRandom").addEventListener("click", randomize);

/* Export PNG */
function exportPNG() {
  const showFxPrev = P.showFx;
  P.showFx = false;
  render();
  cv.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "graphism-" + Date.now() + ".png";
    a.click();
    URL.revokeObjectURL(a.href);
    P.showFx = showFxPrev;
  }, "image/png");
}
$("btnExport").addEventListener("click", exportPNG);

/* Keyboard shortcuts */
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  if (e.key === "r" || e.key === "R") randomize();
  if (e.key === "e" || e.key === "E") exportPNG();
});

/* ═══════════════════════ Effector UI ═══════════════════════ */

const fxList = $("fxList");

function fxSlider(fx, key, label, min, max, step, fmt) {
  const wrap = document.createElement("div");
  wrap.className = "ctl";
  const lbl = document.createElement("label");
  const valSpan = document.createElement("span");
  valSpan.className = "val";
  valSpan.textContent = fmt(fx[key]);
  lbl.append(label, valSpan);
  const input = document.createElement("input");
  input.type = "range";
  input.min = min; input.max = max; input.step = step;
  input.value = fx[key];
  input.addEventListener("input", () => {
    fx[key] = parseFloat(input.value);
    valSpan.textContent = fmt(fx[key]);
  });
  wrap.append(lbl, input);
  return wrap;
}

function fxSelect(fx, key, label, options) {
  const wrap = document.createElement("div");
  wrap.className = "ctl";
  const lbl = document.createElement("label");
  lbl.textContent = label;
  const sel = document.createElement("select");
  for (const [val, text] of options) {
    const o = document.createElement("option");
    o.value = val; o.textContent = text;
    sel.appendChild(o);
  }
  sel.value = fx[key];
  sel.addEventListener("change", () => fx[key] = sel.value);
  wrap.append(lbl, sel);
  return wrap;
}

function buildFxUI() {
  fxList.innerHTML = "";
  for (const fx of effectors) {
    const card = document.createElement("div");
    card.className = "fx-card";

    const head = document.createElement("div");
    head.className = "fx-head";
    const title = document.createElement("b");
    title.innerHTML = `<span class="dot" style="background:${fx.color}"></span>Effector ${fx.id}`;
    const actions = document.createElement("div");
    actions.className = "fx-actions";

    const btnToggle = document.createElement("button");
    btnToggle.className = "small";
    btnToggle.textContent = fx.enabled ? "On" : "Off";
    btnToggle.addEventListener("click", () => {
      fx.enabled = !fx.enabled;
      btnToggle.textContent = fx.enabled ? "On" : "Off";
    });

    const btnDel = document.createElement("button");
    btnDel.className = "small danger";
    btnDel.textContent = "✕";
    btnDel.addEventListener("click", () => {
      effectors = effectors.filter(f => f !== fx);
      buildFxUI();
    });

    actions.append(btnToggle, btnDel);
    head.append(title, actions);
    card.appendChild(head);

    card.appendChild(fxSelect(fx, "target", "Affects", [
      ["rotation", "Rotation"],
      ["scale", "Scale"],
      ["phase", "Phase / delay"],
    ]));
    card.appendChild(fxSelect(fx, "path", "Path", [
      ["orbit", "Orbit (circle)"],
      ["lissajous", "Lissajous"],
      ["figure8", "Figure 8"],
      ["sweepX", "Sweep ↔ horizontal"],
      ["sweepY", "Sweep ↕ vertical"],
    ]));
    card.appendChild(fxSlider(fx, "speed", "Speed", 0, 1.5, 0.01, v => (+v).toFixed(2)));
    card.appendChild(fxSlider(fx, "pathSize", "Path size", 0.05, 0.6, 0.01, v => Math.round(v * 100) + "%"));
    card.appendChild(fxSlider(fx, "radius", "Influence radius", 0.05, 0.7, 0.01, v => Math.round(v * 100) + "%"));
    card.appendChild(fxSlider(fx, "strength", "Strength", 0, 2, 0.01, v => (+v).toFixed(2)));
    card.appendChild(fxSlider(fx, "pulse", "Pulse amount", 0, 1, 0.01, v => Math.round(v * 100) + "%"));
    card.appendChild(fxSlider(fx, "pulseSpeed", "Pulse speed", 0, 3, 0.01, v => (+v).toFixed(2)));

    fxList.appendChild(card);
  }
}

$("addEffector").addEventListener("click", () => makeEffector());

/* ═══════════════════════ Go ═══════════════════════ */

fitCanvas();
requestAnimationFrame(loop);
</script>
